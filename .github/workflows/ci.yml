name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./studio"
          severity: warning

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile app.py
        run: python -m py_compile app.py
      - name: Validate LiteLLM / compose configs
        run: |
          python -m pip install -q pyyaml
          python -c "import yaml; yaml.safe_load(open('litellm/config.yaml', encoding='utf-8')); yaml.safe_load(open('docker-compose.yml', encoding='utf-8'))"
