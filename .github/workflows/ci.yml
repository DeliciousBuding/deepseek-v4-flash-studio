name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./studio"
          severity: warning

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # setup-uv provides both uv and the pinned CPython; the cache key covers
      # uv.lock. pyyaml comes from the dev dependency group instead of an
      # ad-hoc install step.
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Compile Python sources
        run: uv run python -m compileall -q app.py deepseek_lab tests
      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -t . -v
      - name: Build Gradio interface
        run: uv run python -c "from deepseek_lab.backend import OpenAIBackend; from deepseek_lab.config import AppConfig; from deepseek_lab.ui import build_demo; config = AppConfig.from_environment(); build_demo(config, OpenAIBackend(config))"
      - name: Validate LiteLLM / compose configs
        run: uv run python -c "import yaml; yaml.safe_load(open('litellm/config.yaml', encoding='utf-8')); yaml.safe_load(open('docker-compose.yml', encoding='utf-8'))"
      - name: Check requirements.txt mirrors pyproject.toml
        run: |
          uv run python - <<'PY'
          import tomllib
          from pathlib import Path

          declared = sorted(
              tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["dependencies"]
          )
          mirrored = sorted(
              line.strip()
              for line in Path("requirements.txt").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.strip().startswith("#")
          )
          if declared != mirrored:
              raise SystemExit(
                  "dependency drift between pyproject.toml and requirements.txt\n"
                  f"  pyproject.toml:   {declared}\n"
                  f"  requirements.txt: {mirrored}"
              )
          print(f"parity OK: {len(declared)} runtime dependencies")
          PY
