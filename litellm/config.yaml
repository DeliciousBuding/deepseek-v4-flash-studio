# LiteLLM proxy configuration for the standard gateway in front of vLLM.
# It adds stable authentication without changing the native serving stack.
#
# Values use LiteLLM's `os.environ/...` syntax so the same file works in Docker
# and standalone. Point VLLM_BASE_URL at the OpenAI-compatible backend and set
# VLLM_API_KEY (may be empty).

model_list:
  - model_name: deepseek-v4-flash
    litellm_params:
      model: hosted_vllm/deepseek-v4-flash
      api_base: os.environ/VLLM_BASE_URL
      api_key: os.environ/VLLM_API_KEY
      max_tokens: 8192
      stream_timeout: 600

litellm_settings:
  drop_params: true
  num_retries: 1
